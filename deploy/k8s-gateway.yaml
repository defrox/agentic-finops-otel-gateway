apiVersion: v1
kind: Namespace
metadata:
  name: ai-infra
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-gateway-config
  namespace: ai-infra
data:
  litellm-config.yaml: |
    model_list:
      - model_name: enterprise-default
        litellm_params:
          model: openai/llama-3-70b-instruct
          api_base: http://cluster.local
          rpm: 120
      - model_name: enterprise-fallback
        litellm_params:
          model: azure/gpt-4o
          api_base: os.environ/AZURE_API_BASE
          api_key: os.environ/AZURE_API_KEY
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      enable_otel: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finops-llm-gateway
  namespace: ai-infra
  labels:
    app: finops-llm-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: finops-llm-gateway
  template:
    metadata:
      labels:
        app: finops-llm-gateway
    spec:
      containers:
        - name: litellm-proxy
          image: ghcr.io/berriai/litellm:main-stable
          args:
            - "--config"
            - "/app/config/litellm-config.yaml"
            - "--port"
            - "4000"
          ports:
            - containerPort: 4000
              name: http
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-gateway-secrets
                  key: master-key
            - name: AZURE_API_BASE
              valueFrom:
                secretKeyRef:
                  name: llm-gateway-secrets
                  key: azure-api-base
            - name: AZURE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-gateway-secrets
                  key: azure-api-key
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://cluster.local"
            - name: OTEL_SERVICE_NAME
              value: "agentic-finops-gateway"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: config-volume
              mountPath: /app/config
      volumes:
        - name: config-volume
          configMap:
            name: litellm-gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: finops-llm-gateway
  namespace: ai-infra
spec:
  selector:
    app: finops-llm-gateway
  ports:
    - protocol: TCP
      port: 80
      targetPort: 4000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: finops-llm-gateway-hpa
  namespace: ai-infra
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: finops-llm-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
