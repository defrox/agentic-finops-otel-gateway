name: FinOps & OpenTelemetry Gateway CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-gateway-and-telemetry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install opentelemetry-api opentelemetry-sdk pyyaml pytest

      - name: Run FinOps OpenTelemetry unit tests
        run: PYTHONPATH=. pytest -v

      - name: Validate LiteLLM YAML configuration
        run: |
          python -c "import yaml; yaml.safe_load(open('deploy/litellm-config.yaml')); print('LiteLLM config valid')"

      - name: Validate Docker Compose stack
        run: docker compose config -q

      - name: Validate Kubernetes Gateway manifests
        run: |
          python -c "import yaml; docs = list(yaml.safe_load_all(open('deploy/k8s-gateway.yaml'))); assert len(docs) == 5; print(f'Validated {len(docs)} Kubernetes manifests')"
